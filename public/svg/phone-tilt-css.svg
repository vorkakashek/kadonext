<svg xmlns="http://www.w3.org/2000/svg" width="24" height="32" viewBox="0 -4 24 32" role="img" aria-labelledby="title desc">
  <title id="title">Наклон телефона в четырёх направлениях</title>
  <desc id="desc">Белая иконка телефона последовательно наклоняется влево, вправо, верхней и нижней частью</desc>
  <style>
    :root { --phone-color: #fff; }

    .phone {
      fill: none;
      stroke: var(--phone-color, #fff);
      stroke-width: 1.5;
      stroke-linecap: butt;
      stroke-linejoin: round;
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform;
      animation: phone-tilt 5.8s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    @keyframes phone-tilt {
      0%, 10%   { transform: translate(0, 0) rotate(0deg); }
      18%        { transform: translate(-0.15px, 0) rotate(-9deg); }
      27%        { transform: translate(0, 0) rotate(0deg); }
      35%        { transform: translate(0.15px, 0) rotate(9deg); }
      44%        { transform: translate(0, 0) rotate(0deg); }
      52%        { transform: translate(0, -0.15px) rotate(5deg); }
      61%        { transform: translate(0, 0) rotate(0deg); }
      69%        { transform: translate(0, 0.15px) rotate(-5deg); }
      78%, 100% { transform: translate(0, 0) rotate(0deg); }
    }

  </style>

  <!-- Tabler device-mobile (MIT), animated for the tilt hint. -->
  <g class="phone">
    <path d="M6 5a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-14" />
    <path d="M11 4h2" />
    <circle cx="12" cy="17" r="0.75" fill="var(--phone-color, #fff)" stroke="none" />
  </g>
</svg>
