geoip2 /var/lib/GeoIP/dbip-country-lite.mmdb {
    auto_reload 1h;
    $kado_country_code default=ZZ source=$remote_addr country iso_code;
}

map $time_iso8601 $kado_pageview_day {
    "~^(?<kado_calendar_day>\d{4}-\d{2}-\d{2})" $kado_calendar_day;
    default 0000-00-00;
}

map $kado_country_code $kado_country {
    "~^[A-Z]{2}$" $kado_country_code;
    default ZZ;
}

map $request_uri $kado_page_path {
    default "";
    "~^(?<kado_localized_path>/(?:ru|en)/(?:projects(?:/(?:audience|keys-store|baltika|schmidt))?|privacy|consent)?/?)(?:\?.*)?$" $kado_localized_path;
    "~^(?<kado_unlocalized_path>/(?:projects(?:/(?:audience|keys-store|baltika|schmidt))?|privacy|consent)/?)(?:\?.*)?$" $kado_unlocalized_path;
}

map $kado_page_path $kado_content_route {
    default 1;
    "" 0;
}

map $http_user_agent $kado_browser_family {
    default other;
    ~*(?:bot|crawler|spider|slurp|lighthouse|pagespeed|headless|curl|wget|monitor) bot;
    ~*(?:Edg|EdgA|EdgiOS)/ edge;
    ~*(?:OPR/|Opera) opera;
    ~*(?:Firefox|FxiOS)/ firefox;
    ~*(?:Chrome|CriOS)/ chrome;
    ~*Safari/ safari;
}

map $http_referer $kado_referrer_source {
    default other;
    "" direct;
    ~*^https?://(?:www\.)?kadonext\.com(?:[/:]|$) internal;
    ~*^https?://(?:[^/]+\.)?(?:yandex\.[^/]+|ya\.ru)(?:[/:]|$) yandex;
    ~*^https?://(?:[^/]+\.)?google\.[^/]+(?:[/:]|$) google;
    ~*^https?://(?:[^/]+\.)?bing\.com(?:[/:]|$) bing;
    ~*^https?://(?:[^/]+\.)?(?:vk\.com|vk\.ru)(?:[/:]|$) vk;
    ~*^https?://(?:[^/]+\.)?(?:t\.me|telegram\.(?:me|org))(?:[/:]|$) telegram;
    ~*^https?://(?:[^/]+\.)?instagram\.com(?:[/:]|$) instagram;
    ~*^https?://(?:[^/]+\.)?facebook\.com(?:[/:]|$) facebook;
    ~*^https?://(?:[^/]+\.)?(?:x\.com|twitter\.com|t\.co)(?:[/:]|$) x;
    ~*^https?://(?:[^/]+\.)?behance\.net(?:[/:]|$) behance;
    ~*^https?://(?:[^/]+\.)?dribbble\.com(?:[/:]|$) dribbble;
}

map "$request_method:$kado_content_route:$status:$kado_browser_family" $kado_count_pageview {
    default 0;
    ~^GET:1:(?:200|304):(?!bot$) 1;
}

# Privacy-minimised first-party traffic count. The log deliberately contains
# no IP address, raw User-Agent, referrer URL, query string, cookie or visitor
# ID. Browser and source are reduced to the coarse categories above; country
# is resolved locally and stored only as a two-letter code.
log_format kado_pageview escape=json '{"day":"$kado_pageview_day","path":"$kado_page_path","browser":"$kado_browser_family","source":"$kado_referrer_source","country":"$kado_country"}';

server {
    server_name kadonext.com www.kadonext.com _;

    if ($host = www.kadonext.com) {
        return 301 https://kadonext.com$request_uri; # canonical-www
    }

    root /var/www/kadonext/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 13m;

    # Prefer build-time Brotli siblings and compress any remaining text responses.
    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Gzip remains the fallback for clients without Brotli support.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

    location = / {
        try_files /index.html =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300, s-maxage=300, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        access_log off;
    }

    location ^~ /_nuxt/ {
        # Hashed build assets are accumulated across releases so an open tab
        # and a cold CDN edge can still fetch an older lazy chunk.
        root /var/www/kadonext/shared-assets;
        try_files $uri =404;
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Defining Cache-Control here disables add_header inheritance, so repeat
        # the server-level security headers for immutable assets.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        access_log off;
    }

    location ^~ /fonts/ {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location = /api/contact {
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "no-store" always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Private, server-generated analytics dashboard. The allowlist is kept in
    # an untracked VPS-only snippet so a personal IP never enters the repo.
    # Requests from every other public IP are rejected before any file is read.
    location ^~ /analytics/ {
        include /etc/nginx/snippets/kado-analytics-access.conf;
        root /var/lib/kado-analytics/www;
        index index.html;
        try_files $uri $uri/ =404;
        expires -1;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        access_log off;
    }

    location ~ /\. {
        deny all;
    }

    # These public asset paths contain only static files. Give the CDN and
    # browsers a bounded cache lifetime without caching locale HTML or Nuxt
    # payloads, which may change on every release.
    location ~* ^/(brand|env|home|images|og|previews|svg|textures)/ {
        try_files $uri =404;
        expires off;
        # These filenames are not universally content-hashed. Keep edge cache
        # useful without requiring a purge to replace a same-path file.
        add_header Cache-Control "public, max-age=86400, s-maxage=86400, stale-while-revalidate=3600" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        # HTML is served directly by the VPS in asset-CDN mode. Revalidate it
        # on every visit so an old document cannot reference chunks removed by
        # a later atomic release. `expires` does not break add_header inheritance.
        expires -1;
        access_log /var/log/nginx/kadonext-pageviews.log kado_pageview if=$kado_count_pageview;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kadonext.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kadonext.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.kadonext.com) {
        return 301 https://kadonext.com$request_uri;
    } # managed by Certbot

    if ($host = kadonext.com) {
        return 301 https://kadonext.com$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name kadonext.com www.kadonext.com _;
    return 404; # managed by Certbot
}
