server {
    server_name kadonext.com www.kadonext.com _;

    if ($host = www.kadonext.com) {
        return 301 https://kadonext.com$request_uri; # canonical-www
    }

    root /var/www/kadonext/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 13m;

    # Prefer build-time Brotli siblings and compress any remaining text responses.
    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Gzip remains the fallback for clients without Brotli support.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

    location = / {
        # The root is a tiny, locale-neutral selector. Keeping it independent
        # from request headers makes it safe for a full-site CDN cache.
        try_files /index.html =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300, s-maxage=300, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        access_log off;
    }

    location ^~ /_nuxt/ {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Defining Cache-Control here disables add_header inheritance, so repeat
        # the server-level security headers for immutable assets.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        access_log off;
    }

    location ^~ /fonts/ {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location = /api/contact {
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "no-store" always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ~ /\. {
        deny all;
    }

    # These public asset paths contain only static files. Give the CDN and
    # browsers a bounded cache lifetime without caching locale HTML or Nuxt
    # payloads, which may change on every release.
    location ~* ^/(brand|env|home|images|og|previews|svg|textures)/ {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "public, max-age=86400, s-maxage=31536000, stale-while-revalidate=86400" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        # Localized HTML and ordinary static pages are immutable between
        # releases from the CDN's point of view. Purge or wait five minutes
        # after activating a new release; hashed Nuxt/media files stay on the
        # one-year rules above.
        expires 5m;
        add_header Cache-Control "public, max-age=300, s-maxage=300, stale-while-revalidate=86400" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kadonext.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kadonext.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.kadonext.com) {
        return 301 https://kadonext.com$request_uri;
    } # managed by Certbot

    if ($host = kadonext.com) {
        return 301 https://kadonext.com$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name kadonext.com www.kadonext.com _;
    return 404; # managed by Certbot
}
